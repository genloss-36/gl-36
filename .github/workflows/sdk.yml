name: SDK

on:
  push:
    branches: [main]
    tags: ["sdk-v*"]
    paths:
      - "packages/sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sdk.yml"
  pull_request:
    paths:
      - "packages/sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/sdk.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm pack --dry-run -w @gl-36/sdk

  publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package version
        run: test "sdk-v$(node -p "require('./packages/sdk/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Version not on npm yet
        id: npm
        run: |
          v=$(node -p "require('./packages/sdk/package.json').version")
          if [ -n "$(npm view "@gl-36/sdk@$v" version 2>/dev/null)" ]; then
            echo "@gl-36/sdk@$v is already on npm, skipping publish" >> "$GITHUB_STEP_SUMMARY"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published != 'true'
        run: npm stage publish -w @gl-36/sdk --provenance --access public
